services:
  - type: web
    name: legends-tunisia-levels
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /
    envVars:
      - key: LEVELS_BOT_TOKEN
        sync: false
      - key: LEVELS_BACKUP_CHANNEL_ID
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
